<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kairo Android</title>

    <script src="v86/libv86.js"></script>
    <script src="storage.js"></script>
    <script src="android.js"></script>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #android-screen {
            width: 100%;
            height: 100%;
            background: #000;
            position: relative;
        }

        #android-screen .screen {
            width: 100%;
            height: 100%;
            background: #000;
        }

        #android-screen .keyboard {
            display: none;
        }
    </style>
</head>

<body>

    <div id="android-screen">
        <div class="screen"></div>
        <div class="keyboard"></div>
    </div>

</body>
</html>
