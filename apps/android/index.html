<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Kairo Android</title>

    <style>

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #android-screen {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #controls {
            position: fixed;
            top: 10px;
            left: 10px;
            z-index: 1000;
        }

        button {
            padding: 10px 14px;
            margin-right: 5px;
        }

    </style>

</head>


<body>

    <div id="android-screen">

        <div class="screen"></div>

        <div class="keyboard"></div>

    </div>


    <div id="controls">

        <button onclick="startAndroid()">
            Start Android
        </button>

        <button onclick="resetAndroid()">
            Restart
        </button>

        <button onclick="stopAndroid()">
            Stop
        </button>

        <button onclick="fullscreenAndroid()">
            Fullscreen
        </button>

    </div>


    <!-- v86 -->
    <script src="v86/libv86.js"></script>

    <!-- Kairo Android -->
    <script src="storage.js"></script>
    <script src="android.js"></script>

</body>

</html>
