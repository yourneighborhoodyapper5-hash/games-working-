<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0c0e">
<meta name="description" content="Kairo Hub - Games, Apps and AI">
<title>Kairo Hub</title>

<style>
:root {
    --bg: #090a0c;
    --bg2: #0d0f12;
    --panel: #111317;
    --panel2: #15181d;
    --panel3: #191c22;
    --border: #242830;
    --border2: #30353e;
    --text: #f1f3f5;
    --muted: #8b929d;
    --muted2: #636a75;
    --orange: #ff6a00;
    --orange2: #ff7d26;
    --danger: #ff4d4d;
    --green: #52d273;
    --shadow: 0 18px 60px rgba(0,0,0,.35);
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    overflow: hidden;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
}

.app {
    width: 100%;
    height: 100%;
    display: flex;
}

/* SIDEBAR */

.sidebar {
    width: 240px;
    min-width: 240px;
    height: 100%;
    background: #0b0d10;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 18px 12px;
    z-index: 20;
}

.brand {
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 7px 10px 22px;
}

.brand-mark {
    width: 31px;
    height: 31px;
    border: 2px solid var(--orange);
    border-radius: 9px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.brand-mark::before {
    content: "";
    width: 9px;
    height: 9px;
    background: var(--orange);
    border-radius: 3px;
}

.brand-name {
    font-size: 18px;
    font-weight: 750;
    letter-spacing: -.4px;
}

.brand-sub {
    font-size: 10px;
    color: var(--muted2);
    margin-top: 1px;
}

.nav-label {
    color: #555c66;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    padding: 13px 12px 7px;
}

.nav {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.nav-button {
    width: 100%;
    height: 40px;
    border-radius: 8px;
    background: transparent;
    color: #8f96a1;
    display: flex;
    align-items: center;
    gap: 11px;
    padding: 0 12px;
    cursor: pointer;
    text-align: left;
    transition: .15s ease;
}

.nav-button:hover {
    background: #15181d;
    color: #e8eaed;
}

.nav-button.active {
    background: #1a1c20;
    color: #fff;
    box-shadow: inset 2px 0 0 var(--orange);
}

.nav-icon {
    width: 20px;
    text-align: center;
    font-size: 15px;
}

.nav-text {
    font-size: 13px;
    font-weight: 600;
}

.sidebar-spacer {
    flex: 1;
}

.status-card {
    border: 1px solid var(--border);
    background: #0f1115;
    border-radius: 9px;
    padding: 12px;
    margin: 5px;
}

.status-title {
    font-size: 11px;
    font-weight: 700;
    color: #d9dde2;
    margin-bottom: 8px;
}

.status-row {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 10px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 8px rgba(82,210,115,.4);
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
}

.topbar {
    height: 65px;
    min-height: 65px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 22px;
    background: rgba(10,11,14,.92);
}

.page-title {
    font-size: 18px;
    font-weight: 750;
    white-space: nowrap;
}

.search {
    flex: 1;
    max-width: 530px;
    margin-left: auto;
    position: relative;
}

.search input {
    width: 100%;
    height: 38px;
    border-radius: 8px;
    border: 1px solid var(--border);
    outline: none;
    background: #101216;
    color: var(--text);
    padding: 0 13px 0 38px;
    font-size: 12px;
    transition: .15s ease;
}

.search input:focus {
    border-color: #3a404a;
    background: #13161a;
}

.search-icon {
    position: absolute;
    left: 13px;
    top: 10px;
    color: #666d78;
    font-size: 14px;
}

.top-actions {
    display: flex;
    gap: 7px;
}

.icon-button {
    width: 37px;
    height: 37px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #101216;
    color: #9aa1ab;
    cursor: pointer;
    transition: .15s ease;
}

.icon-button:hover {
    color: white;
    border-color: var(--border2);
    background: #171a1f;
}

.content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
}

.content::-webkit-scrollbar {
    width: 8px;
}

.content::-webkit-scrollbar-track {
    background: transparent;
}

.content::-webkit-scrollbar-thumb {
    background: #242830;
    border-radius: 8px;
}

/* HOME */

.hero {
    min-height: 220px;
    border: 1px solid var(--border);
    background:
        radial-gradient(circle at 85% 40%, rgba(255,106,0,.12), transparent 35%),
        linear-gradient(135deg, #111317, #0d0f12);
    border-radius: 13px;
    padding: 30px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    overflow: hidden;
    position: relative;
    box-shadow: var(--shadow);
}

.hero::after {
    content: "KAIRO";
    position: absolute;
    right: -15px;
    bottom: -42px;
    font-size: 170px;
    font-weight: 900;
    color: rgba(255,255,255,.018);
    letter-spacing: -.08em;
    pointer-events: none;
}

.hero-content {
    position: relative;
    z-index: 2;
}

.eyebrow {
    color: var(--orange);
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .16em;
    text-transform: uppercase;
    margin-bottom: 10px;
}

.hero h1 {
    font-size: 32px;
    margin: 0 0 9px;
    letter-spacing: -.8px;
}

.hero p {
    margin: 0;
    color: var(--muted);
    max-width: 530px;
    line-height: 1.55;
    font-size: 13px;
}

.hero-button {
    margin-top: 19px;
    padding: 10px 15px;
    border-radius: 7px;
    background: var(--orange);
    color: #100b07;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    position: relative;
    z-index: 3;
}

.hero-button:hover {
    background: var(--orange2);
}

/* SECTIONS */

.section {
    margin-top: 28px;
}

.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.section-title {
    font-size: 15px;
    font-weight: 750;
}

.section-count {
    color: var(--muted2);
    font-size: 11px;
}

/* CARDS */

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 11px;
}

.card {
    min-height: 142px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition:
        transform .15s ease,
        border-color .15s ease,
        background .15s ease;
    position: relative;
}

.card:hover {
    transform: translateY(-2px);
    border-color: #343a44;
    background: var(--panel2);
}

.card-top {
    height: 82px;
    background:
        radial-gradient(circle at 75% 35%, rgba(255,106,0,.14), transparent 35%),
        linear-gradient(135deg, #171a1f, #101216);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.card-icon {
    width: 42px;
    height: 42px;
    border-radius: 11px;
    background: #0c0e11;
    border: 1px solid #292e36;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--orange);
    font-size: 20px;
    font-weight: 800;
}

.favorite {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    border-radius: 7px;
    background: rgba(0,0,0,.42);
    color: #777e88;
    cursor: pointer;
    z-index: 3;
}

.favorite:hover,
.favorite.active {
    color: var(--orange);
}

.card-info {
    padding: 11px 12px;
}

.card-title {
    font-size: 12px;
    font-weight: 750;
    color: #e9ebee;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-description {
    font-size: 10px;
    color: var(--muted2);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.card-type {
    position: absolute;
    left: 10px;
    top: 10px;
    padding: 4px 6px;
    border-radius: 5px;
    background: rgba(0,0,0,.42);
    color: #a8afb9;
    font-size: 8px;
    font-weight: 750;
    text-transform: uppercase;
    letter-spacing: .08em;
}

/* EMPTY */

.empty {
    border: 1px dashed #292e36;
    border-radius: 10px;
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted2);
    font-size: 12px;
    text-align: center;
    padding: 25px;
}

/* PLAYER */

.player-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.82);
    backdrop-filter: blur(7px);
    z-index: 100;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.player-overlay.open {
    display: flex;
}

.player-window {
    width: min(1400px, 100%);
    height: min(850px, 94vh);
    background: #08090b;
    border: 1px solid #292e36;
    border-radius: 12px;
    box-shadow: 0 30px 100px rgba(0,0,0,.7);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.player-bar {
    height: 48px;
    min-height: 48px;
    background: #101216;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 10px 0 15px;
    gap: 10px;
}

.player-title {
    font-size: 12px;
    font-weight: 700;
    flex: 1;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.player-url {
    color: var(--muted2);
    font-size: 9px;
    max-width: 35%;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
}

.player-buttons {
    display: flex;
    gap: 5px;
}

.player-button {
    width: 32px;
    height: 30px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #15181d;
    color: #9ba2ad;
    cursor: pointer;
}

.player-button:hover {
    color: white;
    background: #1b1f25;
}

.player-button.close:hover {
    color: #ff7777;
}

.player-frame-wrap {
    flex: 1;
    min-height: 0;
    background: #000;
}

.player-frame {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: #000;
}

/* APP PLACEHOLDER */

.app-info {
    max-width: 760px;
}

.app-info h2 {
    margin: 0 0 8px;
    font-size: 24px;
}

.app-info p {
    color: var(--muted);
    line-height: 1.6;
    font-size: 13px;
}

.app-note {
    margin-top: 16px;
    padding: 12px 14px;
    border: 1px solid #34271e;
    background: rgba(255,106,0,.045);
    border-radius: 8px;
    color: #b6a99e;
    font-size: 11px;
    line-height: 1.55;
}

/* TOAST */

.toast {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translate(-50%, 20px);
    opacity: 0;
    pointer-events: none;
    background: #181b20;
    border: 1px solid #30353e;
    color: #e8eaed;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 11px;
    z-index: 300;
    transition: .2s ease;
    box-shadow: var(--shadow);
}

.toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* RESPONSIVE */

@media (max-width: 800px) {
    .sidebar {
        width: 66px;
        min-width: 66px;
        padding: 12px 8px;
    }

    .brand {
        justify-content: center;
        padding: 6px 0 18px;
    }

    .brand-text,
    .nav-text,
    .nav-label,
    .status-card {
        display: none;
    }

    .nav-button {
        justify-content: center;
        padding: 0;
    }

    .nav-icon {
        font-size: 17px;
    }

    .content {
        padding: 15px;
    }

    .topbar {
        padding: 0 13px;
    }

    .hero {
        padding: 22px;
    }

    .hero h1 {
        font-size: 25px;
    }

    .player-overlay {
        padding: 0;
    }

    .player-window {
        width: 100%;
        height: 100%;
        border-radius: 0;
    }

    .player-url {
        display: none;
    }
}
</style>
</head>

<script>
/* =========================================================
   KAIRO HUB
   ========================================================= */

const CONFIG = {
    owner: "yourneighborhoodyapper5-hash",
    repo: "games-working-",
    branch: "main",

    apiBase:
        "https://api.github.com/repos/yourneighborhoodyapper5-hash/games-working-",

    pagesBase:
        "https://yourneighborhoodyapper5-hash.github.io/games-working-/"
};


/* =========================================================
   STATE
   ========================================================= */

let games = [];
let apps = [];
let currentPage = "home";
let currentItem = null;
let favorites = JSON.parse(
    localStorage.getItem("kairo-games-favorites") || "[]"
);

let searchQuery = "";


/* =========================================================
   BUILT-IN APPS
   ========================================================= */

const builtInApps = [

    {
        id: "youtube",
        name: "YouTube",
        description: "Video platform",
        icon: "▶",
        type: "app",
        configured: false,
        url: null
    },

    {
        id: "android",
        name: "Android",
        description: "Android emulator",
        icon: "A",
        type: "app",
        configured: false,
        url: null
    },

    {
        id: "ai",
        name: "AI",
        description: "Kairo AI",
        icon: "K",
        type: "app",
        configured: false,
        url: null
    },

    {
        id: "files",
        name: "Files",
        description: "File manager",
        icon: "▤",
        type: "app",
        configured: false,
        url: null
    },

    {
        id: "notes",
        name: "Notes",
        description: "Local notes",
        icon: "N",
        type: "app",
        configured: false,
        url: null
    },

    {
        id: "calculator",
        name: "Calculator",
        description: "Calculator",
        icon: "+",
        type: "app",
        configured: false,
        url: null
    },

    {
        id: "settings",
        name: "Settings",
        description: "Kairo settings",
        icon: "⚙",
        type: "app",
        configured: false,
        url: null
    }

];


/* =========================================================
   DOM
   ========================================================= */

const content = document.getElementById("content");
const pageTitle = document.getElementById("pageTitle");
const searchInput = document.getElementById("searchInput");

const playerOverlay = document.getElementById("playerOverlay");
const playerFrame = document.getElementById("playerFrame");
const playerTitle = document.getElementById("playerTitle");
const playerUrl = document.getElementById("playerUrl");

const toast = document.getElementById("toast");


/* =========================================================
   UTILITIES
   ========================================================= */

function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {

        toast.classList.remove("show");

    }, 2200);
}


function saveFavorites() {

    localStorage.setItem(
        "kairo-games-favorites",
        JSON.stringify(favorites)
    );

}


function isFavorite(id) {

    return favorites.includes(id);

}


function toggleFavorite(id, event) {

    if (event) {
        event.stopPropagation();
    }

    if (isFavorite(id)) {

        favorites = favorites.filter(
            item => item !== id
        );

        showToast("Removed from favorites");

    } else {

        favorites.push(id);

        showToast("Added to favorites");

    }

    saveFavorites();

    render();

}


/* =========================================================
   GITHUB DISCOVERY
   ========================================================= */

async function getGitHubTree() {

    const url =
        `${CONFIG.apiBase}/git/trees/${CONFIG.branch}?recursive=1`;

    const response = await fetch(url, {
        headers: {
            "Accept": "application/vnd.github+json"
        }
    });

    if (!response.ok) {

        throw new Error(
            `GitHub API returned ${response.status}`
        );

    }

    return response.json();

}


function cleanName(name) {

    return name
        .replace(/[-_]+/g, " ")
        .replace(/\b\w/g, char => char.toUpperCase());

}


function ignoredDirectory(path) {

    const ignored = [

        ".git",
        ".github",
        "node_modules",
        "dist",
        "build",
        "assets",
        "docs",
        "screenshots"

    ];

    return ignored.some(folder => {

        return path
            .split("/")
            .includes(folder);

    });

}


function discoverGames(tree) {

    const discovered = new Map();

    for (const item of tree) {

        if (item.type !== "blob") {
            continue;
        }

        if (!item.path.toLowerCase().endsWith("/index.html")) {
            continue;
        }

        const parts = item.path.split("/");

        if (parts.length < 2) {
            continue;
        }

        parts.pop();

        const directory = parts.join("/");

        if (ignoredDirectory(directory)) {
            continue;
        }

        const id = directory.toLowerCase();

        if (discovered.has(id)) {
            continue;
        }

        const name = cleanName(
            parts[parts.length - 1]
        );

        const url =
            CONFIG.pagesBase +
            directory
                .split("/")
                .map(encodeURIComponent)
                .join("/") +
            "/";

        discovered.set(id, {

            id: `game-${id}`,

            name,

            description:
                "Browser game",

            icon:
                name
                    .trim()
                    .charAt(0)
                    .toUpperCase() || "G",

            type: "game",

            path: directory,

            url

        });

    }

    return Array.from(discovered.values())
        .sort((a, b) =>
            a.name.localeCompare(b.name)
        );

}


/* =========================================================
   LOAD GAMES
   ========================================================= */

async function loadGames() {

    try {

        setConnection(
            true,
            "Loading library..."
        );

        const tree =
            await getGitHubTree();

        games =
            discoverGames(tree.tree || []);

        setConnection(
            true,
            `${games.length} Games`
        );

        render();

    } catch (error) {

        console.error(error);

        games = [];

        setConnection(
            false,
            "GitHub unavailable"
        );

        render();

        showToast(
            "Couldn't load GitHub library"
        );

    }

}


/* =========================================================
   CONNECTION STATUS
   ========================================================= */

function setConnection(online, text) {

    const dot =
        document.querySelector(".status-dot");

    const connectionText =
        document.getElementById("connectionText");

    if (online) {

        dot.style.background =
            "var(--green)";

        dot.style.boxShadow =
            "0 0 8px rgba(82,210,115,.4)";

    } else {

        dot.style.background =
            "var(--danger)";

        dot.style.boxShadow =
            "0 0 8px rgba(255,77,77,.4)";

    }

    connectionText.textContent = text;

}


/* =========================================================
   GAMEPAD
   ========================================================= */

function updateGamepadStatus() {

    const pads =
        navigator.getGamepads
            ? navigator.getGamepads()
            : [];

    let connected = false;

    for (const pad of pads) {

        if (pad) {

            connected = true;
            break;

        }

    }

    const dot =
        document.getElementById("gamepadDot");

    const text =
        document.getElementById("gamepadText");

    if (connected) {

        dot.style.background =
            "var(--green)";

        dot.style.boxShadow =
            "0 0 8px rgba(82,210,115,.4)";

        text.textContent =
            "Controller Connected";

    } else {

        dot.style.background =
            "#555c66";

        dot.style.boxShadow =
            "none";

        text.textContent =
            "No Controller";

    }

}


window.addEventListener(
    "gamepadconnected",
    updateGamepadStatus
);

window.addEventListener(
    "gamepaddisconnected",
    updateGamepadStatus
);

setInterval(
    updateGamepadStatus,
    2000
);


/* =========================================================
   FILTERING
   ========================================================= */

function allItems() {

    return [
        ...games,
        ...builtInApps
    ];

}


function filteredItems(items) {

    const query =
        searchQuery
            .trim()
            .toLowerCase();

    if (!query) {
        return items;
    }

    return items.filter(item => {

        return (
            item.name
                .toLowerCase()
                .includes(query) ||

            item.description
                .toLowerCase()
                .includes(query)
        );

    });

}


/* =========================================================
   CARD
   ========================================================= */

function createCard(item) {

    const card =
        document.createElement("div");

    card.className = "card";

    const favorite =
        isFavorite(item.id);

    card.innerHTML = `

        <div class="card-top">

            <div class="card-type">
                ${item.type}
            </div>

            <div class="card-icon">
                ${escapeHTML(item.icon)}
            </div>

            <button
                class="favorite ${favorite ? "active" : ""}"
                title="Favorite"
            >
                ${favorite ? "★" : "☆"}
            </button>

        </div>

        <div class="card-info">

            <div class="card-title">
                ${escapeHTML(item.name)}
            </div>

            <div class="card-description">
                ${escapeHTML(item.description)}
            </div>

        </div>

    `;

    card.addEventListener(
        "click",
        () => openItem(item)
    );

    card.querySelector(".favorite")
        .addEventListener(
            "click",
            event => toggleFavorite(
                item.id,
                event
            )
        );

    return card;

}


function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   GRID
   ========================================================= */

function renderGrid(items, emptyMessage) {

    const filtered =
        filteredItems(items);

    if (!filtered.length) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            emptyMessage;

        content.appendChild(empty);

        return;

    }

    const grid =
        document.createElement("div");

    grid.className = "grid";

    for (const item of filtered) {

        grid.appendChild(
            createCard(item)
        );

    }

    content.appendChild(grid);

}


/* =========================================================
   HOME
   ========================================================= */

function renderHome() {

    pageTitle.textContent = "Home";

    content.innerHTML = `

        <section class="hero">

            <div class="hero-content">

                <div class="eyebrow">
                    Kairo Environment
                </div>

                <h1>
                    Games. Apps. Everything.
                </h1>

                <p>
                    A single place for your browser games,
                    applications, AI tools and experiments.
                    Everything lives inside the Kairo ecosystem.
                </p>

                <button
                    class="hero-button"
                    id="browseButton"
                >
                    Browse Library
                </button>

            </div>

        </section>

    `;

    document
        .getElementById("browseButton")
        .addEventListener(
            "click",
            () => switchPage("games")
        );


    const favoriteItems =
        allItems()
            .filter(item =>
                isFavorite(item.id)
            );

    const recentGames =
        games.slice(0, 6);

    const section =
        document.createElement("section");

    section.className = "section";

    section.innerHTML = `

        <div class="section-head">

            <div class="section-title">
                Games
            </div>

            <div class="section-count">
                ${games.length}
            </div>

        </div>

    `;

    content.appendChild(section);

    renderGrid(
        recentGames,
        "No games discovered yet."
    );


    if (favoriteItems.length) {

        const favSection =
            document.createElement("section");

        favSection.className = "section";

        favSection.innerHTML = `

            <div class="section-head">

                <div class="section-title">
                    Favorites
                </div>

                <div class="section-count">
                    ${favoriteItems.length}
                </div>

            </div>

        `;

        content.appendChild(
            favSection
        );

        renderGrid(
            favoriteItems.slice(0, 6),
            "No favorites."
        );

    }

}


/* =========================================================
   GAMES
   ========================================================= */

function renderGames() {

    pageTitle.textContent = "Games";

    content.innerHTML = "";

    const section =
        document.createElement("section");

    section.className = "section";

    section.innerHTML = `

        <div class="section-head">

            <div class="section-title">
                Game Library
            </div>

            <div class="section-count">
                ${games.length} games
            </div>

        </div>

    `;

    content.appendChild(section);

    renderGrid(
        games,
        "No games found. Add a game folder containing index.html to the repository."
    );

}


/* =========================================================
   APPS
   ========================================================= */

function renderApps() {

    pageTitle.textContent = "Apps";

    content.innerHTML = "";

    const section =
        document.createElement("section");

    section.className = "section";

    section.innerHTML = `

        <div class="section-head">

            <div class="section-title">
                Kairo Apps
            </div>

            <div class="section-count">
                ${builtInApps.length}
            </div>

        </div>

    `;

    content.appendChild(section);

    renderGrid(
        builtInApps,
        "No apps available."
    );

}


/* =========================================================
   FAVORITES
   ========================================================= */

function renderFavorites() {

    pageTitle.textContent =
        "Favorites";

    content.innerHTML = "";

    const items =
        allItems()
            .filter(item =>
                isFavorite(item.id)
            );

    const section =
        document.createElement("section");

    section.className = "section";

    section.innerHTML = `

        <div class="section-head">

            <div class="section-title">
                Your Favorites
            </div>

            <div class="section-count">
                ${items.length}
            </div>

        </div>

    `;

    content.appendChild(section);

    renderGrid(
        items,
        "Nothing here yet. Click ☆ on a game or app to add it."
    );

}


/* =========================================================
   ABOUT
   ========================================================= */

function renderAbout() {

    pageTitle.textContent =
        "About";

    content.innerHTML = `

        <section class="section">

            <div class="app-info">

                <div class="eyebrow">
                    Kairo Hub
                </div>

                <h2>
                    One place for the Kairo ecosystem.
                </h2>

                <p>
                    Kairo Hub is a lightweight browser-based
                    launcher for games, applications, AI tools
                    and experiments.
                </p>

                <p>
                    Games are discovered directly from the
                    GitHub repository, so adding a new game
                    with an index.html file can make it appear
                    automatically.
                </p>

                <div class="app-note">

                    Repository:
                    ${CONFIG.owner}/${CONFIG.repo}

                    <br><br>

                    Branch:
                    ${CONFIG.branch}

                </div>

            </div>

        </section>

    `;

}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    if (currentPage === "home") {
        renderHome();
        return;
    }

    if (currentPage === "games") {
        renderGames();
        return;
    }

    if (currentPage === "apps") {
        renderApps();
        return;
    }

    if (currentPage === "favorites") {
        renderFavorites();
        return;
    }

    if (currentPage === "about") {
        renderAbout();
        return;
    }

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function switchPage(page) {

    currentPage = page;

    document
        .querySelectorAll(".nav-button")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.page === page
            );

        });

    searchInput.value = "";

    searchQuery = "";

    render();

}


document
    .querySelectorAll(".nav-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            () => switchPage(
                button.dataset.page
            )
        );

    });


/* =========================================================
   SEARCH
   ========================================================= */

searchInput.addEventListener(
    "input",
    event => {

        searchQuery =
            event.target.value;

        render();

    }
);


/* =========================================================
   OPEN ITEM
   ========================================================= */

function openItem(item) {

    currentItem = item;

    /*
       Built-in apps do not have URLs yet.
       You can connect them later by adding a URL
       to their object in builtInApps.
    */

    if (!item.url) {

        showToast(
            `${item.name} is ready to configure`
        );

        return;

    }

    playerTitle.textContent =
        item.name;

    playerUrl.textContent =
        item.url;

    playerFrame.src =
        item.url;

    playerOverlay.classList.add(
        "open"
    );

    document.body.style.overflow =
        "hidden";

}


/* =========================================================
   PLAYER CONTROLS
   ========================================================= */

document
    .getElementById("playerClose")
    .addEventListener(
        "click",
        closePlayer
    );


function closePlayer() {

    playerOverlay.classList.remove(
        "open"
    );

    playerFrame.src =
        "about:blank";

    currentItem = null;

    document.body.style.overflow =
        "hidden";

}


document
    .getElementById("playerReload")
    .addEventListener(
        "click",
        () => {

            if (!currentItem) {
                return;
            }

            playerFrame.src =
                currentItem.url;

        }
    );


document
    .getElementById("playerFullscreen")
    .addEventListener(
        "click",
        async () => {

            const windowElement =
                document.querySelector(
                    ".player-window"
                );

            try {

                if (
                    document.fullscreenElement
                ) {

                    await document.exitFullscreen();

                } else {

                    await windowElement.requestFullscreen();

                }

            } catch (error) {

                console.error(error);

            }

        }
    );


playerOverlay.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            playerOverlay
        ) {

            closePlayer();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape" &&
            playerOverlay.classList.contains("open")
        ) {

            closePlayer();

        }

    }
);


/* =========================================================
   REFRESH
   ========================================================= */

document
    .getElementById("refreshButton")
    .addEventListener(
        "click",
        async () => {

            showToast(
                "Refreshing library..."
            );

            await loadGames();

        }
    );


/* =========================================================
   HASH LAUNCH
   ========================================================= */

function checkHashLaunch() {

    const hash =
        window.location.hash;

    if (!hash) {
        return;
    }

    if (
        hash.startsWith("#play=")
    ) {

        const id =
            decodeURIComponent(
                hash.substring(6)
            );

        const item =
            allItems().find(
                game =>
                    game.id === id ||
                    game.path === id
            );

        if (item) {

            openItem(item);

        }

    }

}


/* =========================================================
   STARTUP
   ========================================================= */

render();

loadGames();

updateGamepadStatus();

setTimeout(
    checkHashLaunch,
    1000
);

</script>
